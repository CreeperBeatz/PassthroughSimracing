name: Depth passthrough build

# Builds the Quest client APK and the Windows streamer on every push, so the depth passthrough
# fork can be installed without a local Android toolchain. The streamer must come from the same
# build: the depth passthrough settings don't exist in upstream ALVR.

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      # GPU shader tests skip themselves when no GPU is available; the GLSL ES translation and
      # uniform layout tests always run
      - name: Run tests
        run: cargo test -p alvr_graphics -p alvr_session

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-32"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Prepare deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform android

      - name: Build client
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        working-directory: ./alvr/client_openxr
        run: cargo xtask build-client

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: alvr-client-quest-apk
          path: ./build/alvr_client_android/alvr_client_android.apk

  build-windows-streamer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip unzip pkgconfiglite

      - uses: Swatinem/rust-cache@v2

      - name: Prepare deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform windows

      - name: Build and package streamer (.zip)
        env:
          RUST_BACKTRACE: 1
        run: |
          mkdir artifacts/
          cargo xtask build-streamer --platform windows --ci
          zip -r9X artifacts/alvr_streamer_windows.zip ./build/alvr_streamer*

      - name: Upload streamer
        uses: actions/upload-artifact@v7
        with:
          name: alvr-streamer-windows
          path: ./artifacts/*
